name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '0 19 * * 1-5'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.deployment-check.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site and market data
        run: npm run build:pages

      - name: Check whether deployment is needed
        id: deployment-check
        env:
          EVENING_RUN: ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * 1-5' }}
        run: node --experimental-strip-types scripts/check-deployment-needed.ts

      - name: Configure Pages
        if: steps.deployment-check.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.deployment-check.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
